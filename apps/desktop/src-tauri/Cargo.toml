[package]
name = "desktop"
version = "0.1.0"
description = "A git-heavy AI code editor."
authors = ["you"]
license = ""
repository = ""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
agent-client-protocol = "2.2.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
