packages:
  - apps/*
  - packages/*

# Every version shared by workspace projects, so those projects cannot drift apart.
catalog: { '@tauri-apps/api': ^2.9.0, '@tauri-apps/cli': ^2.11.5, '@tauri-apps/plugin-dialog': ^2.4.0, '@tauri-apps/plugin-log': ^2.9.0, '@testing-library/jest-dom': ^6.9.1, '@testing-library/react': ^16.3.0, '@testing-library/user-event': ^14.6.1, '@types/node': ^26.6.2, '@types/react': ^19.3.0, '@types/react-dom': ^19.3.0, '@vitejs/plugin-react': ^6.1.1, jsdom: ^27.4.0, react: ^19.3.0, react-dom: ^19.3.0, react-markdown: ^10.1.0, typescript: ^7.0.2, vite: ^8.3.0, vitest: ^5.0.1 }

# Vite still lists esbuild as optional; its install script needs approval.
allowBuilds:
  esbuild: true

minimumReleaseAge: 0
