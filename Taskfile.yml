version: "3"

includes:
  tauri:
    taskfile: taskfiles/tauri.yml
    flatten: true
    vars:
      ARTIFACT_NAME: "samokod"
  rust:
    taskfile: taskfiles/rust.yml
    dir: src-tauri
  typescript: taskfiles/typescript.yml

tasks:
  init:
    desc: Set up the development environment
    deps: [prereqs]
    cmds:
      - git config core.hooksPath scripts/git-hooks
      - pnpm install --frozen-lockfile

  dev:
    desc: Run the app in development mode (no auto-reload - restart when idle)
    cmds:
      - pnpm tauri dev --no-watch

  check:
    desc: Run all checks
    deps: [biome, knip, bindings, rust:check, typescript:check]

  generate-bindings:
    desc: Regenerate TypeScript bindings from Rust wire types
    dir: src-tauri
    cmds:
      - cargo test --locked -p samokod --lib bindings_tests::export_bindings_file
    sources:
      - src-tauri/src/**/*.rs
    generates:
      - src/bindings.ts

  bindings:
    desc: Fail when generated bindings are stale
    deps: [generate-bindings]
    cmds:
      - git diff --exit-code -- src/bindings.ts

  fix:
    desc: Apply safe formatting and lint fixes
    cmds:
      - pnpm exec biome check --write --error-on-warnings .
      - cargo fmt --manifest-path src-tauri/Cargo.toml

  biome:
    desc: Check linting and formatting across the repo
    cmds:
      - pnpm exec biome check --error-on-warnings .

  knip:
    desc: Check for unused TypeScript dependencies and exports
    cmds:
      - pnpm exec knip

  prereqs:
    desc: Check that required programs are installed
    cmds:
      - bash scripts/check-prereqs.sh
