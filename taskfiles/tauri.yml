version: "3"

vars:
  ARTIFACT_DIR: "release/{{.ARTIFACT_NAME}}"

tasks:
  build:
    desc: Bundle the app for distribution
    cmds:
      - node scripts/tauri/build.mjs "{{.ARTIFACT_DIR}}"

  deploy:
    desc: Put the release app in /Applications
    deps: [build]
    platforms: [darwin]
    cmds:
      - node scripts/tauri/install-macos.mjs "{{.ARTIFACT_DIR}}" /Applications

  bump:
    desc: Raise the app's version (patch, minor, or major)
    cmds:
      - node scripts/tauri/bump.mjs {{.CLI_ARGS}}
