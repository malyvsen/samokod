version: "3"

vars:
  ARTIFACT_DIR: "release/{{.ARTIFACT_NAME}}"

tasks:
  build:
    desc: Bundle the app for distribution
    cmds:
      - node scripts/tauri/build.mjs "{{.ARTIFACT_DIR}}"

  deploy:
    desc: Put the release app in /Applications
    deps: [build, link-cli]
    platforms: [darwin]
    cmds:
      - node scripts/tauri/install-macos.mjs "{{.ARTIFACT_DIR}}" /Applications

  link-cli:
    desc: Link the release binary onto PATH
    platforms: [darwin]
    cmds:
      - mkdir -p ~/.local/bin && ln -sf /Applications/samokod.app/Contents/MacOS/samokod ~/.local/bin/samokod

  bump:
    desc: Raise the app's version (patch, minor, or major)
    cmds:
      - node scripts/tauri/bump.mjs {{.CLI_ARGS}}

  generate-icon:
    desc: Regenerate bundle icons from the vector source
    cmds:
      - pnpm tauri icon src-tauri/app-icon.svg
